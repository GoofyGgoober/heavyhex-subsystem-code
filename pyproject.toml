[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-surface-code"
version = "0.1.0"
description = "Distance-3 rotated planar surface code (built from scratch)"
requires-python = ">=3.10"

[project.optional-dependencies]
sim = ["qiskit>=2", "qiskit-aer>=0.15", "pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.pyright]
extraPaths = ["src"]
include = ["src", "tests"]

