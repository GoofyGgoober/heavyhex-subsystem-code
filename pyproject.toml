[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heavyhex-subsystem-code"
version = "0.1.0"
description = "Heavy-hex subsystem code: error suppression from d=3 to d=5 on IBM hardware"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Nadav Abramson"}]
requires-python = ">=3.10"

[project.urls]
Repository = "https://github.com/GoofyGgoober/heavyhex-subsystem-code"

[project.scripts]
heavyhex = "heavyhex.cli:main"

[project.optional-dependencies]
sim = ["qiskit>=2", "qiskit-aer>=0.15"]
matching = ["numpy>=1.24,<3", "pymatching>=2.3,<3", "stim>=1.14"]
hardware = ["qiskit-ibm-runtime>=0.40,<0.50"]
test = ["pytest", "heavyhex-subsystem-code[sim,matching]"]
dev = ["heavyhex-subsystem-code[sim,test,hardware]", "ruff>=0.16,<0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.pyright]
extraPaths = ["src"]
include = ["src", "tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
