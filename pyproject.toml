[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heavyhex-scalability-check"
version = "0.1.0"
description = "Does the heavy-hex code get better from d=3 to d=5 on IBM hardware?"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
heavyhex = "heavyhex.cli:main"

[project.optional-dependencies]
sim = ["qiskit>=2", "qiskit-aer>=0.15"]
matching = ["numpy>=1.24,<3", "pymatching>=2.3,<3", "stim>=1.14"]
hardware = ["qiskit-ibm-runtime>=0.40"]
test = ["pytest", "heavyhex-scalability-check[sim,matching]"]
dev = ["heavyhex-scalability-check[sim,test,hardware]", "ruff>=0.16,<0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.pyright]
extraPaths = ["src"]
include = ["src", "tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
