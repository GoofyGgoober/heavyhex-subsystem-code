[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-surface-code"
version = "0.1.0"
description = "Distance-3 rotated planar surface code (built from scratch)"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
surface-code = "surface_code.simulation.cli:main"

[project.optional-dependencies]
sim = ["qiskit>=2", "qiskit-aer>=0.15"]
test = ["pytest", "quantum-surface-code[sim]"]
dev = ["quantum-surface-code[sim,test]", "ruff>=0.16,<0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.pyright]
extraPaths = ["src"]
include = ["src", "tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Optional simulator imports deliberately follow pytest.importorskip.
"tests/test_aer.py" = ["E402"]
