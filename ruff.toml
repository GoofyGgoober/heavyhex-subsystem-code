# Lint and format settings. They live here rather than in pyproject.toml, which is part
# of the code fingerprint every job in runs/ records (tests/test_provenance.py); this
# file takes precedence over pyproject.toml's [tool.ruff].
target-version = "py310"
line-length = 100
extend-exclude = ["runs", "build"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
# Greek letters are physics here, not look-alikes of Latin ones.
allowed-confusables = ["σ"]

[lint.isort]
# Sibling modules of the docs scripts, imported from their own folder.
known-local-folder = ["common", "draw_blueprint", "leaky", "rerun", "where"]

[lint.per-file-ignores]
# The code that prepared and analysed the runs, frozen at tag v0.2.0: checked by the
# rules it was written to.
"src/**" = ["B", "UP", "SIM", "C4", "RUF"]
# The post hoc analysis scripts: pyflakes only. They run at import and share module
# state with their siblings, so they keep their own layout.
"docs/diagnosis/revision/**" = ["E", "I", "B", "UP", "SIM", "C4", "RUF"]
# The other analysis and figure scripts zip arrays that are equal in length by
# construction, and were run as they are: zip(strict=) is not added to them.
"docs/**" = ["B905"]
"paper/**" = ["B905"]

[format]
exclude = ["docs/diagnosis/revision/**"]
