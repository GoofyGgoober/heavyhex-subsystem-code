# Lint and format settings. They live here rather than in pyproject.toml, which is part
# of the code fingerprint every job in runs/ records (tests/test_provenance.py); this
# file takes precedence over pyproject.toml's [tool.ruff].
target-version = "py310"
line-length = 100
extend-exclude = ["runs", "build"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
# Greek letters are physics here, not look-alikes of Latin ones.
allowed-confusables = ["σ"]

[lint.isort]
# Sibling modules of the docs scripts, imported from their own folder.
known-local-folder = [
  "common", "detectors", "draw_blueprint", "exact_sim", "fig_A_effect_sizes",
  "fig_B_detector_diagnostics", "fig_C_idle_dephasing", "fig_D_flag_records", "fits", "fitting",
  "frame_sim", "hmm", "hmm_bootstrap", "hmm_causes", "idle_f", "leakage", "leakage_fit",
  "leakage_frame_rerun", "leakage_grid", "make_figures", "matching", "perqubit_f", "placements",
  "refiring", "refit", "tableau_ref",
]

[lint.per-file-ignores]
# The code that prepared and analysed the runs, frozen at tag v0.2.0: checked by the
# rules it was written to.
"src/**" = ["B", "UP", "SIM", "C4", "RUF"]
# The other analysis and figure scripts zip arrays that are equal in length by
# construction, and were run as they are: zip(strict=) is not added to them. O is the
# matrix of observable flips, as in the decoder code.
"docs/**" = ["B905", "E741"]
# These set one BLAS thread per process before numpy is imported (worker pools).
"docs/analysis/{hmm_bootstrap,leakage,leakage_checks,leakage_grid,leakage_grid_bootstrap,leakage_rerun}.py" = ["E402"]
"paper/**" = ["B905"]
